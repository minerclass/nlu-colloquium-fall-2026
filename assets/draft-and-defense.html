<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, attrs, parent, text){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    parent.appendChild(e); return e;
  }
  var clamp = function(x,a,b){ return Math.max(a, Math.min(b, x)); };
  var prog = function(t,a,b){ return clamp((t-a)/(b-a),0,1); };
  var ease = function(x){ return x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2; };
  var lerp = function(a,b,x){ return a+(b-a)*x; };
  function type(id, str, t, a, b){ $(id).textContent = str.slice(0, Math.floor(prog(t,a,b)*str.length)); }

  // ---- generated document: headings and lines appear in sequence ----
  var doc = $('doc'), parts = [];
  parts.push(el('text',{x:1066,y:340,'font-size':30,'class':'serif',fill:'#17232d'},doc,'2.1 Productive Struggle and Desirable Difficulty'));
  var w1 = [690,650,700,610,680,560,700,640,520];
  w1.forEach(function(w,i){ parts.push(el('rect',{x:1066,y:366+i*26,width:w,height:11,rx:5,fill:'#c9c1b1'},doc)); });
  parts.push(el('text',{x:1066,y:626,'font-size':30,'class':'serif',fill:'#17232d'},doc,'2.2 Generative AI and Cognitive Offloading'));
  var w2 = [700,630,680,590,700];
  w2.forEach(function(w,i){ parts.push(el('rect',{x:1066,y:652+i*26,width:w,height:11,rx:5,fill:'#c9c1b1'},doc)); });

  // ---- classroom desks (shot C) ----
  var desks = $('desks'), screens = [];
  var skins = ['#8d5b3e','#e2b48f','#5e3a26','#c48a66','#f0c9a6','#7a4b31'];
  var hairs = ['#241812','#8a4e2a','#17120e','#3a2414','#c9a66b','#241812'];
  for (var i = 0; i < 6; i++) {
    var cx = 300 + i*264, g = el('g',{},desks);
    el('path',{d:'M'+(cx-58)+' 760 L'+(cx-58)+' 700 Q'+(cx-58)+' 668 '+(cx-26)+' 664 L'+(cx+26)+' 664 Q'+(cx+58)+' 668 '+(cx+58)+' 700 L'+(cx+58)+' 760 Z',fill:['#2f6970','#91462f','#b58127','#34434e','#1f5057','#6f3324'][i]},g);
    el('circle',{cx:cx,cy:612,r:44,fill:skins[i]},g);
    el('path',{d:'M'+(cx-44)+' 606 Q'+(cx-44)+' 560 '+cx+' 558 Q'+(cx+46)+' 560 '+(cx+44)+' 606 Q'+(cx+30)+' 584 '+cx+' 584 Q'+(cx-28)+' 584 '+(cx-44)+' 606 Z',fill:hairs[i]},g);
    el('rect',{x:cx-90,y:780,width:180,height:16,fill:'#34434e'},g);
    el('rect',{x:cx-80,y:796,width:14,height:104,fill:'#2b3843'},g);
    el('rect',{x:cx+66,y:796,width:14,height:104,fill:'#2b3843'},g);
    el('rect',{x:cx-70,y:690,width:140,height:92,rx:6,fill:'#2b3843',stroke:'#4a5a66','stroke-width':3},g);
    var scr = el('g',{},g);
    el('rect',{x:cx-60,y:698,width:120,height:76,rx:3,fill:'#f3efe6'},scr);
    el('rect',{x:cx-50,y:708,width:70,height:8,rx:3,fill:'#34434e'},scr);
    for (var k = 0; k < 4; k++) el('rect',{x:cx-50,y:724+k*12,width:[96,88,96,64][k],height:6,rx:3,fill:'#c9c1b1'},scr);
    screens.push(scr);
  }

  var ask1 = 'Which source changed', ask2 = 'your thinking most?';
  var promptStr = 'Synthesize the research on productive struggle.';

  // ---- timeline (seconds) ----
  // A 0-6 the draft | B 6-11 the defense | C 11-14.4 every classroom | end card 14.4-18
  window.render = function(t){
    var opA = 1 - prog(t, 5.8, 6.2);
    var opB = prog(t, 5.8, 6.2) * (1 - prog(t, 10.8, 11.2));
    var opC = prog(t, 10.8, 11.2) * (1 - prog(t, 14.2, 14.6));
    var opE = prog(t, 14.2, 14.6);
    $('A').setAttribute('opacity', opA.toFixed(3));
    $('B').setAttribute('opacity', opB.toFixed(3));
    $('C').setAttribute('opacity', opC.toFixed(3));
    $('endCard').setAttribute('opacity', opE.toFixed(3));

    // time tag
    $('tag').textContent = t < 6 ? 'WEDNESDAY · 11:47 PM' : 'MONTHS LATER · THE DEFENSE';
    $('tagBox').setAttribute('opacity', (1 - prog(t, 10.8, 11.1)).toFixed(3));

    // shot A: type the prompt, generate, the document fills
    type('prompt', promptStr, t, 0.6, 2.2);
    $('genBtn').setAttribute('opacity', prog(t, 2.0, 2.3).toFixed(3));
    var mv = ease(prog(t, 2.2, 2.8));
    $('cursorA').setAttribute('transform', 'translate(' + lerp(1560, 1712, mv).toFixed(1) + ',' + lerp(420, 262, mv).toFixed(1) + ')');
    $('cursorA').setAttribute('opacity', (prog(t, 2.1, 2.3) * (1 - prog(t, 3.4, 3.6))).toFixed(3));
    $('genRect').setAttribute('fill', t >= 2.85 && t < 3.05 ? '#1f5057' : '#2f6970');
    parts.forEach(function(p, i){ p.setAttribute('opacity', prog(t, 3.0 + i*0.07, 3.12 + i*0.07).toFixed(3)); });
    var words = Math.round(4812 * ease(prog(t, 3.0, 4.6)));
    $('wc').textContent = t < 3.0 ? '0 WORDS' : (t < 4.6 ? words.toLocaleString('en-US') + ' WORDS' : '4,812 WORDS · 41 SECONDS');
    $('wc').setAttribute('fill', t < 4.6 ? '#91462f' : '#2f6970');
    var surprised = t >= 3.6;
    $('aMouth').setAttribute('opacity', surprised ? 0 : 1);
    $('aMouthO').setAttribute('opacity', surprised ? 1 : 0);
    $('aBrowL').setAttribute('d', surprised ? 'M570 450 L596 448' : 'M570 458 L596 462');
    $('aBrowR').setAttribute('d', surprised ? 'M640 450 L614 448' : 'M640 458 L614 462');

    // shot B: the question, the pause, the pages lose their weight
    $('askBubble').setAttribute('opacity', prog(t, 6.6, 6.9).toFixed(3));
    var chars = Math.floor(prog(t, 6.9, 8.7) * (ask1.length + ask2.length));
    $('ask1').textContent = ask1.slice(0, Math.min(chars, ask1.length));
    $('ask2').textContent = chars > ask1.length ? ask2.slice(0, chars - ask1.length) : '';
    $('thinkBubble').setAttribute('opacity', prog(t, 9.0, 9.3).toFixed(3));
    [1,2,3].forEach(function(n){ $('dot'+n).setAttribute('opacity', (0.3 + 0.7*Math.max(0, Math.sin((t - 9 - n*0.18) * 5))).toFixed(3)); });
    $('papers').setAttribute('opacity', (1 - 0.72 * prog(t, 9.2, 10.6)).toFixed(3));
    var unsure = t >= 9.0;
    $('bMouth').setAttribute('d', unsure ? 'M410 524 Q418 518 426 524 Q432 528 436 522' : 'M410 522 Q423 516 436 522');
    $('bBrowL').setAttribute('d', unsure ? 'M390 470 L414 466' : 'M390 474 L414 476');
    $('bBrowR').setAttribute('d', unsure ? 'M456 470 L432 474' : 'M456 474 L432 476');

    // shot C: every screen fills at once
    $('cTag').setAttribute('opacity', prog(t, 11.2, 11.5).toFixed(3));
    $('cLine').setAttribute('opacity', prog(t, 11.6, 12.0).toFixed(3));
    screens.forEach(function(s, i){ s.setAttribute('opacity', prog(t, 12.2 + i*0.18, 12.4 + i*0.18).toFixed(3)); });
    $('cAsk').setAttribute('opacity', prog(t, 13.1, 13.4).toFixed(3));

    // end card: the second line and rule
    $('endLine').setAttribute('opacity', prog(t, 15.2, 15.6).toFixed(3));
    $('endRule').setAttribute('width', (96 * ease(prog(t, 15.5, 16.0))).toFixed(1));

    // fade in and out
    $('fade').setAttribute('opacity', Math.max(1 - t/0.4, prog(t, 17.6, 18)).toFixed(3));
  };
  render(location.hash ? parseFloat(location.hash.slice(1)) : 7.5);
})();
</script>
</body>
</html>
